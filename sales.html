<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>M1S · Shalam Sales</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="app.css">
</head>
<body class="salespage">
<canvas id="bg" aria-hidden="true"></canvas>
<div class="wrap">
  <header class="glass bar">
    <div class="top">
      <h1>M1S · Shalam Sales</h1>
      <span id="health" class="health" aria-live="polite"></span>
      <span class="sp"></span>
      <span id="busy" class="chip busy" hidden><span class="mini"></span><span id="busyMsg">Loading…</span><button class="ghost" id="btnCancelBusy" type="button">Cancel</button></span>
      <button id="btnRefresh" type="button" hidden title="Read both files again now">Refresh</button>
      <span id="who" class="chip who" hidden></span>
    </div>
  </header>

  <section id="signin" class="glass" hidden>
    <h2>Shalam Sales</h2>
    <p id="signinMsg">Sign in with your M1S account to get the latest sales files.</p>
    <button class="primary" id="btnSignin" type="button">Sign in</button>
  </section>

  <section id="app" hidden aria-busy="false">
    <div class="glass salescard">
      <h2 id="impH">Latest ATS import</h2>
      <p class="note" id="impP" aria-live="polite"></p>
      <div class="salesfiles">
        <div class="salesfile"><button type="button" class="dl" id="btnDlSales" disabled><svg class="ico" width="15" height="15" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2v8m-3.5-3.5L8 10l3.5-3.5M3 13h10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Download On hand ATS</span></button><div class="selinfo" id="infoSales" aria-live="polite"></div></div>
        <div class="salesfile"><button type="button" class="dl china" id="btnDlChina" disabled><svg class="ico" width="15" height="15" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2v8m-3.5-3.5L8 10l3.5-3.5M3 13h10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Download Pull from China</span></button><div class="selinfo" id="infoChina" aria-live="polite"></div></div>
      </div>
    </div>
  </section>
</div>
<div id="toast" class="glass" role="status" aria-live="polite"></div>
<script src="config.js"></script>
<script src="vendor/msal/msal-browser.min.js"></script>
<script src="core/common.js"></script>
<script src="core/salesSheet.js"></script>
<script src="sales.js"></script>
</body>
</html>
